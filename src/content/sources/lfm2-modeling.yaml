notes: Lfm2MLP. When block_auto_adjust_ff_dim is true, the FFN width is int(2 · intermediate_size / 3), times block_ffn_dim_multiplier, rounded up to a multiple of block_multiple_of. So intermediate_size 12288 builds width 8192 and 6656 builds 4608, matching LFM2 report Table 1 and the cards' parameter counts.
